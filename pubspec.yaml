# Ruang kerja pub (Dart workspace) untuk seluruh aplikasi & paket Flutter (PRD §13.0, §17.2).
# Satu pubspec.lock di akar. Pengecekan: `dart pub global activate melos 7.8.2` sekali, lalu `melos run periksa`.
name: payoung_ruang_kerja
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - Paket/AdaptorPerangkat
  - Paket/Inti
  - Paket/KlienApi
  - Paket/MesinKasir
  - Paket/SistemDesain
  - Aplikasi/Kasir
  - Aplikasi/Pemilik

dev_dependencies:
  melos: ^8.9.0

# K-7 (§17.2.6): basis data lokal kasir terenkripsi. Pustaka native `sqlite3` diganti SQLite3 Multiple Ciphers (lisensi
# MIT, tanpa OpenSSL) untuk semua platform; aplikasi menolak membuka basis data bila pustaka tanpa enkripsi termuat.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

melos:
  scripts:
    format:
      description: Cek format Dart (lebar 120).
      run: dart format --line-length 120 --set-exit-if-changed Paket Aplikasi/Kasir Aplikasi/Pemilik
    analisis:
      description: Analisis statis seluruh paket (fatal pada info).
      run: flutter analyze --fatal-infos --fatal-warnings Paket Aplikasi/Kasir Aplikasi/Pemilik
    tes:dart:
      description: Test paket Dart murni (Inti, MesinKasir) dengan `dart test` agar dependensi Flutter tidak terselip.
      exec: dart test
      packageFilters:
        dirExists: test
        flutter: false
    tes:flutter:
      description: Test paket & aplikasi Flutter.
      exec: flutter test
      packageFilters:
        dirExists: test
        flutter: true
    periksa:
      description: Format + analisis + test (sama dengan job CI Flutter).
      steps:
        - format
        - analisis
        - tes:dart
        - tes:flutter
