name: kasir
description: "Aplikasi POS: kasir, KDS, dan gudang (Android, iOS/iPadOS, Windows)."
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  adaptor_perangkat:
    path: ../../Paket/AdaptorPerangkat
  inti:
    path: ../../Paket/Inti
  sistem_desain:
    path: ../../Paket/SistemDesain
  klien_api:
    path: ../../Paket/KlienApi
  mesin_kasir:
    path: ../../Paket/MesinKasir
  drift: ^2.35.0
  sqlite3: ^3.7.0
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  flutter_riverpod: ^3.4.3
  cryptography: ^2.9.0
  http: ^1.6.0
  wakelock_plus: ^1.8.0
  image_picker: ^1.2.3
  universal_ble: ^2.3.0
  win32: ^6.4.0
  ffi: ^2.2.0
  printing: ^5.15.1
  pdf: ^3.13.1
  qr: ^3.0.2
  # Pemindai QR kode aktivasi (F-02 langkah 5). Android & iOS saja; Windows tidak didukung paket ini,
  # di sana kode aktivasi diketik manual (PemindaiQrPlatform.CekTersedia()).
  mobile_scanner: ^7.4.2
  # Modul Salesman bagian 2: lokasi sekali saat mulai kunjungan (izin "saat aplikasi dipakai" saja). Gagal/ditolak/
  # tidak tersedia (mis. Windows tanpa layanan lokasi) tidak pernah menahan kunjungan.
  geolocator: ^14.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
