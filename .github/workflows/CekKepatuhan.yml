name: Cek Kepatuhan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Audit PAY-P1-01: dua push beruntun ke main tidak boleh berebut menerbitkan `aset-terbaru` (run lama yang selesai
# belakangan akan menimpa build baru dengan build lama). Run yang sedang berjalan dibatalkan oleh push berikutnya.
concurrency:
  group: cek-kepatuhan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  konvensi:
    name: Konvensi & dokumen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Konvensi penamaan & pola terlarang (seluruh repo)
        run: python3 Alat/CekKonvensi.py --semua
      - name: Dokumen/ sinkron dengan PRD.md
        run: python3 Alat/PecahPrd.py --cek
      - name: Migrasi yang sudah ada di main tidak diubah
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          # D-13: folder dipindah dari Backend/ ke Aplikasi/Web/. Pindah lokasi murni (R100, isi identik) diizinkan;
          # perubahan isi, hapus, atau pindah yang disertai perubahan isi tetap ditolak.
          DIUBAH=$(git diff --name-status -M --diff-filter=MDR "origin/${{ github.base_ref }}"...HEAD -- 'Aplikasi/Web/database/migrations/' 'Backend/database/migrations/' | awk '$1 != "R100"' || true)
          if [ -n "$DIUBAH" ]; then
            echo "Migrasi yang sudah di-merge tidak boleh diubah/dihapus (CLAUDE.md #15):"
            echo "$DIUBAH"
            exit 1
          fi
      - name: Tidak ada test yang di-skip
        run: |
          if grep -rnE -- '->skip\(|markTestSkipped|skip: true|@Skip' Aplikasi/Web/tests Aplikasi/Kasir Aplikasi/Pemilik Paket 2>/dev/null; then
            echo "Test yang di-skip terdeteksi. Hapus skip atau minta persetujuan pemilik produk."
            exit 1
          fi

  backend:
    name: "Aplikasi Web: PHP (8.3, MySQL 8)"
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: PosSaasTes
          MYSQL_USER: pos_saas
          MYSQL_PASSWORD: rahasia-lokal-tes
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: Aplikasi/Web
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, intl, mbstring, pdo_mysql, zip, gd
          coverage: none
      - name: Pasang dependensi (sesuai composer.lock)
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Audit keamanan dependensi PHP (audit F-11)
        run: composer audit --no-dev --locked
      - name: Pint + Larastan level 8
        run: composer analisis
      # Audit PAY-P2-01: Pest tetap berjalan walau analisis statis gagal, supaya satu error PHPStan tidak
      # menyembunyikan regresi perilaku (job tetap merah bila salah satunya gagal).
      - name: Pest (Unit, Fitur di MySQL, Arsitektur)
        if: ${{ !cancelled() }}
        run: composer tes:cepat

  backend-mariadb:
    name: "Aplikasi Web: PHP (8.3, MariaDB 11.8) — informasi, tidak memblokir"
    # Audit PAY-P1-06: produksi berjalan di MariaDB 11.8 sedangkan kontraknya MySQL 8. Job ini membuktikan (atau
    # membantah) bahwa seluruh Pest juga lulus di MariaDB; setelah hijau konsisten, hapus `continue-on-error`.
    continue-on-error: true
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: PosSaasTes
          MARIADB_USER: pos_saas
          MARIADB_PASSWORD: rahasia-lokal-tes
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: Aplikasi/Web
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, intl, mbstring, pdo_mysql, zip, gd
          coverage: none
      - name: Pasang dependensi (sesuai composer.lock)
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Pest (Unit, Fitur, Arsitektur di MariaDB)
        run: composer tes:cepat

  web:
    name: "Aplikasi Web: frontend (TypeScript, ESLint, Prettier, Vitest, build)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Aplikasi/Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Aplikasi/Web/package-lock.json
      - run: npm ci
      - name: Audit keamanan dependensi npm produksi (audit F-11)
        run: npm audit --omit=dev --audit-level=high
      - name: tsc + ESLint (penamaan) + Prettier + Vitest
        run: npm run periksa
      - name: Build produksi
        run: npm run build
      # Audit PAY-P2-10: public/build ikut di-commit (permintaan pemilik produk, deploy tanpa Node). Langkah ini
      # hanya memberi informasi apakah build yang di-commit sama dengan build dari source di runner ini; hasilnya
      # tidak memblokir karena byte-identik antar mesin belum terbukti. Merah di sini = jalankan `npm run build`
      # lalu commit ulang public/build.
      - name: Informasi - public/build ter-commit sama dengan build dari source
        continue-on-error: true
        run: |
          git add -N public/build
          git diff --stat --exit-code -- public/build

  flutter:
    name: Flutter (format, analyze, test, vektor uji)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Pasang dependensi ruang kerja (sesuai pubspec.lock)
        run: dart pub get --enforce-lockfile
      - name: Pasang melos
        run: dart pub global activate melos 7.8.2
      # Audit PAY-P2-02: empat pemeriksaan sebagai langkah terpisah (`melos run periksa` = keempatnya berurutan), supaya
      # penyebab kegagalan terlihat langsung di log dan satu langkah merah tidak menyembunyikan yang lain.
      - name: dart format
        run: melos run format
      - name: flutter analyze
        if: ${{ !cancelled() }}
        run: melos run analisis
      - name: dart test (Inti, MesinKasir + vektor uji)
        if: ${{ !cancelled() }}
        run: melos run tes:dart
      - name: flutter test (AdaptorPerangkat, SistemDesain, Kasir, Pemilik)
        if: ${{ !cancelled() }}
        run: melos run tes:flutter

  # Audit F-25: artefak rilis tunggal (PHP tanpa dev + public/build) yang terikat SHA commit, dengan checksum SHA-256.
  # Deploy memakai berkas ini, bukan build manual di tempat lain.
  rilis:
    name: Artefak rilis (SHA ${{ github.sha }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [konvensi, backend, web, flutter]
    runs-on: ubuntu-latest
    # Hanya job ini boleh menulis rilis; izin global tetap contents: read.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: Aplikasi/Web
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, intl, mbstring, pdo_mysql, zip, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Aplikasi/Web/package-lock.json
      - name: Dependensi produksi PHP
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --classmap-authoritative
      - name: Build frontend
        run: npm ci && npm run build
      - name: Paket rilis + checksum
        run: |
          NAMA="payoung-web-${GITHUB_SHA}"
          # Audit PAY-P2-04: isi artefak adalah daftar putih (bukan "semua kecuali"), supaya berkas pengembangan
          # (tests, .github, sumber JS, README, basis data uji) tidak pernah ikut terkirim ke server.
          STAGE="$(mktemp -d)/payoung"
          mkdir -p "$STAGE/resources" "$STAGE/storage/app/public" "$STAGE/storage/framework/cache/data" \
            "$STAGE/storage/framework/sessions" "$STAGE/storage/framework/views" "$STAGE/storage/logs"
          rsync -a --exclude='PosSaasTes*' --exclude='*.log' --exclude='public/hot' --exclude='public/storage' \
            app bootstrap config database lang public routes vendor artisan composer.json composer.lock .env.example "$STAGE/"
          rsync -a resources/views resources/data "$STAGE/resources/"
          test -f "$STAGE/vendor/autoload.php" && test -f "$STAGE/public/build/manifest.json"
          for terlarang in tests .github node_modules resources/js .env; do
            if [ -e "$STAGE/$terlarang" ]; then echo "Artefak memuat $terlarang"; exit 1; fi
          done
          tar -czf "../../${NAMA}.tar.gz" -C "$STAGE" .
          cd ../..
          sha256sum "${NAMA}.tar.gz" > "${NAMA}.tar.gz.sha256"
      # D-36: paket Payoung Mandiri untuk pembeli lisensi = artefak yang sama, edisi Lisensi ditanam (`.env` EDISI
      # diabaikan) dan rute konsol Platform Pengelola tidak ikut. Tanpa rute itu edisi SaaS bahkan tidak bisa boot.
      - name: Paket Payoung Mandiri (edisi Lisensi terkunci) + checksum
        run: |
          cd ../..
          NAMA="payoung-mandiri-${GITHUB_SHA}"
          STAGE="$(mktemp -d)/payoung"
          mkdir -p "$STAGE"
          tar -xzf "payoung-web-${GITHUB_SHA}.tar.gz" -C "$STAGE"
          printf "<?php\n\ndeclare(strict_types=1);\n\nreturn 'Lisensi';\n" > "$STAGE/bootstrap/EdisiTerkunci.php"
          # D-36: tanggal rilis = tanggal commit (WIB), dibandingkan dengan PembaruanSampai di berkas lisensi.
          TANGGAL="$(TZ=Asia/Jakarta git show -s --date=format-local:%Y-%m-%d --format=%cd HEAD)"
          printf "<?php\n\ndeclare(strict_types=1);\n\nreturn '%s';\n" "$TANGGAL" > "$STAGE/bootstrap/TanggalRilis.php"
          rm "$STAGE/routes/Pengelola.php"
          sed -i 's/^EDISI=.*/# Edisi terkunci di paket ini (bootstrap\/EdisiTerkunci.php); EDISI tidak dibaca./' "$STAGE/.env.example"
          php -r '$c = require "'"$STAGE"'/config/lisensi.php"; exit($c["Edisi"] === "Lisensi" && $c["EdisiTerkunci"] === true && preg_match("/^\\d{4}-\\d{2}-\\d{2}$/", (string) $c["TanggalRilis"]) === 1 ? 0 : 1);'
          tar -czf "${NAMA}.tar.gz" -C "$STAGE" .
          sha256sum "${NAMA}.tar.gz" > "${NAMA}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: payoung-web-${{ github.sha }}
          path: |
            payoung-web-${{ github.sha }}.tar.gz
            payoung-web-${{ github.sha }}.tar.gz.sha256
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: payoung-mandiri-${{ github.sha }}
          path: |
            payoung-mandiri-${{ github.sha }}.tar.gz
            payoung-mandiri-${{ github.sha }}.tar.gz.sha256
          retention-days: 90

      # Hosting payoung.id tanpa Node (Panduan/PasangDiHosting.md langkah 5), jadi public/build harus
      # dibangun di luar server. Artefak Actions di atas kedaluwarsa 30 hari dan hanya bisa diunduh
      # lewat peramban, karena itu berkasnya juga diterbitkan sebagai aset rilis bertag tetap
      # `aset-terbaru` yang bisa diambil server dengan satu perintah curl (repo publik, tanpa token).
      - name: Paket public/build + checksum
        run: |
          cd public
          zip -qr ../../../public-build.zip build
          cd ../../..
          sha256sum public-build.zip > public-build.zip.sha256
      - name: Terbitkan aset tampilan ke rilis aset-terbaru
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          CATATAN="Aset tampilan (public/build) hasil build commit ${GITHUB_SHA}.
          Tag ini selalu menunjuk build terbaru dari main; unduh lewat Panduan/PasangDiHosting.md langkah 5."
          # Dihapus lalu dibuat ulang, bukan diedit: `gh release edit --target` tidak memindahkan tag
          # yang sudah ada, sehingga tag akan menunjuk commit lama dan menyesatkan saat dicocokkan.
          # Terbitkan hanya bila commit ini masih ujung main; kalau sudah ada push yang lebih baru, biarkan run itu
          # yang menerbitkan (audit PAY-P1-01), supaya `aset-terbaru` tidak pernah mundur ke build lama.
          TERBARU="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ -n "${TERBARU}" ] && [ "${TERBARU}" != "${GITHUB_SHA}" ]; then
            echo "main sudah maju ke ${TERBARU}; lewati penerbitan aset untuk ${GITHUB_SHA}."
            exit 0
          fi
          gh release delete aset-terbaru --yes --cleanup-tag || true
          gh release create aset-terbaru --target "${GITHUB_SHA}" \
            --title "Aset tampilan terbaru" --notes "${CATATAN}" \
            public-build.zip public-build.zip.sha256
